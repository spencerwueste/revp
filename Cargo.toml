[workspace]
resolver = "2"
members = [
    "crates/revp-core",
    "crates/revp",
    "crates/modules/*",
    "crates/revp-acme",
    "tools/bench-upstream",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
pingora = { version = "0.9", default-features = false, features = ["proxy", "lb", "cache", "rustls"] }
pingora-core = { version = "0.9", default-features = false, features = ["rustls"] }
pingora-proxy = { version = "0.9", default-features = false, features = ["rustls"] }
pingora-http = "0.9"
pingora-cache = { version = "0.9", default-features = false, features = ["rustls"] }
pingora-load-balancing = { version = "0.9", default-features = false, features = ["rustls"] }
pingora-limits = "0.9"
pingora-timeout = "0.9"
pingora-error = "0.9"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
arc-swap = "1"
matchit = "0.9"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
anyhow = "1"
thiserror = "2"
bytes = "1"
http = "1"
log = "0.4"
env_logger = "0.11"
tracing = "0.1"
clap = { version = "4", features = ["derive"] }
humantime-serde = "1"
parking_lot = "0.12"
ahash = "0.8"
once_cell = "1"
notify = "8"
chrono = { version = "0.4", features = ["serde"] }
serde_json = "1"
httpdate = "1"
percent-encoding = "2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
strip = true
debug = false

[profile.bench-dbg]
inherits = "release"
strip = false
debug = 1
